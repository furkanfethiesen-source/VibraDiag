
app:
  name: "VibraDiag"
  version: "0.1.0"
  description: "Vibration Analysis and Fault Diagnosis System"
  debug: false

api:
  host: "0.0.0.0"
  port: 8000
  reload: true
  title: "VibraDiag Fault Diagnosis API"
  version: "0.1.0"
  description: "Vibration Analysis, Signal Processing & Fault Diagnosis REST and SSE API"
  cors_origins: ["*"]
  max_upload_size_mb: 50
  upload_dir: "./data/uploads"
  checkpointer_type: "sqlite"  
  sqlite_db_path: "./data/sessions.db"
  plot_format_default: "json"  


llm:
  provider: "groq"
  model: "qwen/qwen3.6-27b"
  temperature: 0.2
  max_tokens: 4096
  timeout: 60

embeddings:
  provider: "HuggingFaceEmbeddings"
  model: "BAAI/bge-m3"
  device: "mps"
  batch_size: 32
  normalize_embeddings: true

streamlit:
  page_title: "VibraDiag - Fault Diagnosis System"
  page_icon: "⚡"
  layout: "wide"
  show_graph_state: false
  show_tool_calls: true
  api_base_url: "http://localhost:8000"
  default_machine_type: "rotating"
  default_machine_class: "class_2"
  default_fs: 12000
  default_rpm: 1797

logging:
  level: "INFO"                     
  format: "{time:HH:mm:ss} | {level} | {message}"
  colorize: true

vision_llm:
  provider: "gemini"
  model: "gemini-3.5-flash"
  timeout: 60
  max_retries: 4

paths:
  qdrant_persist_path: "./qdrant_data"
  docstore_path: "./docstore.db"
  gold_dataset_path: "./data/evaluation/retrieval_benchmark_dev8.json"
  eval_output_dir: "./data/eval_reports"
  text_chunks_json: "./data/processed/text_chunks.json"
  visual_chunks_json: "./data/processed/visual_chunks.json"
  test_signal_path: "data/signal_test/105.mat"
  sample_outputs_dir: "sample_outputs"
  sample_signal_only_json: "sample_outputs/signal_only.json"
  sample_hybrid_json: "sample_outputs/sample_hybrid.json"
  sample_rag_only_json: "sample_outputs/sample_rag_only.json"


decomposer:
  provider: "groq"
  model: "qwen/qwen3.6-27b"
  temperature: 0.1
  max_tokens: 512
  max_sub_queries: 3
  min_sub_queries: 2
  confidence_threshold: 0.55
  model_path: "src/query_decomposer/models/complexity_pipeline.pkl"
  training_data_path: "data/decomposer_data/training.jsonl"

self_corrector:
  dsp_consistency_threshold: 1.0
  faithfulness_threshold: 0.70
  relevance_threshold: 0.65
  prf_min_score_guard: 0.40
  max_retrieval_attempts: 2
  max_generation_attempts: 2
  global_max_cycles: 3
