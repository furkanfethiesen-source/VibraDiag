
app:
  name: "VibraDiag"
  version: "0.1.0"
  description: "Vibration Analysis and Fault Diagnosis System"
  debug: false

llm:
  provider: "groq"
  model: "llama-3.3-70b-versatile"
  temperature: 0.2
  max_tokens: 2048
  timeout: 60

embeddings:
  provider: "HuggingFaceEmbeddings"
  model: "BAAI/bge-m3"
  device: "mps"
  batch_size: 32
  normalize_embeddings: true

streamlit:
  page_title: "VibraDiag - Fault Diagnosis System"
  page_icon: "⚡"
  layout: "wide"
  show_graph_state: false 
  show_tool_calls: true 

logging:
  level: "INFO"                     
  format: "{time:HH:mm:ss} | {level} | {message}"
  colorize: true

vision_llm:
  provider: "gemini"
  model: "gemini-3.5-flash"
  timeout: 60
  max_retries: 4

paths:
  qdrant_persist_path: "./qdrant_data"
  docstore_path: "./docstore.db"
  gold_dataset_path: "./data/evaluation/retrieval_benchmark_dev8.json"
  eval_output_dir: "./data/eval_reports"
  text_chunks_json: "./data/processed/text_chunks.json"
  visual_chunks_json: "./data/processed/visual_chunks.json"


decomposer:
  provider: "groq"
  model: "qwen/qwen3.6-27b"
  temperature: 0.1
  max_tokens: 512
  max_sub_queries: 3
  min_sub_queries: 2
  confidence_threshold: 0.55
  model_path: "src/query_decomposer/models/complexity_pipeline.pkl"
  training_data_path: "data/decomposer_data/training.jsonl"
